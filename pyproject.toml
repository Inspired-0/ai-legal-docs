[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-legal-docs"
version = "0.1.0"
description = "Synthetic demo of structured extraction and deterministic DOCX filling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "docxtpl>=0.20,<1",
  "num2words>=0.5.14,<1",
  "python-docx>=1.2,<2",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_legal_docs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
